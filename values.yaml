# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Extra labels added to ALL resources
commonLabels: {}
# -- Extra annotations added to ALL resources
commonAnnotations: {}

# ---------------------------------------------------------------------------
# Workload type — pick ONE
# ---------------------------------------------------------------------------
workload:
  type: deployment   # deployment | statefulset | daemonset

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: nginx
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: my-registry-secret

# ---------------------------------------------------------------------------
# Replicas & update strategy
# ---------------------------------------------------------------------------
replicaCount: 1
# How many old ReplicaSets to keep for rollback
revisionHistoryLimit: 3
# StatefulSet only: OrderedReady | Parallel
podManagementPolicy: OrderedReady

strategy: {}
# Deployment:   type: RollingUpdate | Recreate
#               rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
# StatefulSet:  type: RollingUpdate | OnDelete
#               rollingUpdate: { partition: 0 }
# DaemonSet:    type: RollingUpdate | OnDelete
#               rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }

# ---------------------------------------------------------------------------
# Pod metadata
# ---------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Security Contexts
# ---------------------------------------------------------------------------
podSecurityContext: {}
# fsGroup: 2000
# fsGroupChangePolicy: OnRootMismatch
# runAsUser: 1000
# runAsGroup: 3000
# runAsNonRoot: true
# supplementalGroups: [1000]
# sysctls:
#   - name: net.core.somaxconn
#     value: "1024"
# seccompProfile:
#   type: RuntimeDefault
# seLinuxOptions:
#   level: "s0:c123,c456"
# windowsOptions:
#   gmsaCredentialSpecName: my-spec

securityContext: {}
# capabilities:
#   drop: [ALL]
#   add: [NET_BIND_SERVICE]
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000
# runAsGroup: 3000
# allowPrivilegeEscalation: false
# privileged: false
# procMount: Default
# seccompProfile:
#   type: RuntimeDefault
# seLinuxOptions:
#   level: "s0:c123,c456"

# ---------------------------------------------------------------------------
# Container — main container spec
# ---------------------------------------------------------------------------
command: []
args: []
workingDir: ""

# stdin / tty
stdin: false
stdinOnce: false
tty: false

# Termination message
terminationMessagePath: /dev/termination-log
terminationMessagePolicy: File   # File | FallbackToLogsOnError

# ---------------------------------------------------------------------------
# Ports — range supported
# ---------------------------------------------------------------------------
ports: []
# - name: http
#   containerPort: 8080
#   protocol: TCP        # TCP | UDP | SCTP
# - name: grpc
#   containerPort: 9090
# - name: metrics
#   containerPort: 9091
#   hostPort: 9091       # bind to node port directly (use with care)

# ---------------------------------------------------------------------------
# Environment variables — range supported
# ---------------------------------------------------------------------------
env: []
# Literal value:
# - name: MY_VAR
#   value: "hello"
#
# From field/resource:
# - name: POD_NAME
#   valueFrom:
#     fieldRef:
#       fieldPath: metadata.name
# - name: POD_IP
#   valueFrom:
#     fieldRef:
#       fieldPath: status.podIP
# - name: NODE_NAME
#   valueFrom:
#     fieldRef:
#       fieldPath: spec.nodeName
# - name: MEM_LIMIT
#   valueFrom:
#     resourceFieldRef:
#       containerName: myapp
#       resource: limits.memory
# From ConfigMap:
# - name: DB_HOST
#   valueFrom:
#     configMapKeyRef:
#       name: my-config
#       key: db-host
# From Secret:
# - name: DB_PASS
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: password

envFrom: []
# - configMapRef:
#     name: my-config
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: another-config
#     optional: true

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   cpu: 500m
#   memory: 256Mi
#   nvidia.com/gpu: 1     # GPU support

# ---------------------------------------------------------------------------
# Probes (full spec, all fields supported)
# ---------------------------------------------------------------------------
livenessProbe: {}
# httpGet:
#   path: /healthz
#   port: http
#   httpHeaders:
#     - name: Custom-Header
#       value: Awesome
# initialDelaySeconds: 10
# periodSeconds: 10
# timeoutSeconds: 5
# successThreshold: 1
# failureThreshold: 3
#
# OR exec:
# exec:
#   command: ["/bin/sh", "-c", "pg_isready"]
#
# OR tcpSocket:
# tcpSocket:
#   port: 5432
#
# OR gRPC:
# grpc:
#   port: 9090
#   service: liveness

readinessProbe: {}
startupProbe: {}

# ---------------------------------------------------------------------------
# Container Restart Rules (alpha — requires K8s 1.35+, feature gate
# RestartAllContainersOnContainerExits)
# ---------------------------------------------------------------------------
containerRestartRules: []
# - exitCode: 42              # trigger on specific exit code
#   action: RestartAllContainers   # in-place restart of ALL containers (init → sidecar → main)
#
# Preserves: pod UID, IP, network namespace, sandbox, volumes (emptyDir + PVC).
# Resets:    all containers terminated, init containers re-run in order,
#            sidecars + regular containers restart, ephemeral containers terminated.

# ---------------------------------------------------------------------------
# Lifecycle hooks
# ---------------------------------------------------------------------------
lifecycle: {}
# postStart:
#   exec:
#     command: ["/bin/sh", "-c", "echo started"]
# preStop:
#   exec:
#     command: ["/bin/sh", "-c", "sleep 10"]

# ---------------------------------------------------------------------------
# Volume Mounts — range supported
# ---------------------------------------------------------------------------
volumeMounts: []
# - name: config
#   mountPath: /etc/config
#   readOnly: true
# - name: data
#   mountPath: /data
#   subPath: myapp-data          # mount a sub-path inside the volume
# - name: data
#   mountPath: /data2
#   subPathExpr: $(POD_NAME)     # env var expansion in subPath
# - name: dev-sda
#   mountPath: /dev/xvda
#   mountPropagation: HostToContainer  # None | HostToContainer | Bidirectional

# Raw block device mounts (PVC must be Block mode)
volumeDevices: []
# - name: block-vol
#   devicePath: /dev/xvda

# ---------------------------------------------------------------------------
# Volumes — ALL Kubernetes volume types — range supported
# ---------------------------------------------------------------------------
volumes: []

# ── ConfigMap ────────────────────────────────────────────────────
# - name: config-vol
#   configMap:
#     name: my-configmap
#     defaultMode: 0644
#     items:
#       - key: app.conf
#         path: app.conf
#         mode: 0600

# ── Secret ───────────────────────────────────────────────────────
# - name: secret-vol
#   secret:
#     secretName: my-secret
#     defaultMode: 0400
#     items:
#       - key: tls.crt
#         path: tls.crt

# ── EmptyDir ─────────────────────────────────────────────────────
# - name: tmp
#   emptyDir: {}
# - name: shared-mem
#   emptyDir:
#     medium: Memory
#     sizeLimit: 256Mi

# ── PersistentVolumeClaim ────────────────────────────────────────
# - name: data
#   persistentVolumeClaim:
#     claimName: my-pvc
#     readOnly: false

# ── HostPath ─────────────────────────────────────────────────────
# - name: host-vol
#   hostPath:
#     path: /data/myapp
#     type: DirectoryOrCreate
#     # types: Directory | DirectoryOrCreate | File | FileOrCreate
#     #        Socket | CharDevice | BlockDevice

# ── Projected (combine secret + configMap + SA token + downwardAPI)
# - name: projected-vol
#   projected:
#     defaultMode: 0444
#     sources:
#       - serviceAccountToken:
#           path: token
#           expirationSeconds: 3600
#       - configMap:
#           name: my-config
#       - secret:
#           name: my-secret
#       - downwardAPI:
#           items:
#             - path: labels
#               fieldRef:
#                 fieldPath: metadata.labels

# ── DownwardAPI ──────────────────────────────────────────────────
# - name: downward-vol
#   downwardAPI:
#     items:
#       - path: labels
#         fieldRef:
#           fieldPath: metadata.labels
#       - path: annotations
#         fieldRef:
#           fieldPath: metadata.annotations
#       - path: cpu-limit
#         resourceFieldRef:
#           containerName: myapp
#           resource: limits.cpu

# ── NFS ──────────────────────────────────────────────────────────
# - name: nfs-vol
#   nfs:
#     server: nfs.example.com
#     path: /exports/data
#     readOnly: false

# ── CSI (generic CSI driver — used for cloud storage, secrets stores, etc.)
# - name: csi-vol
#   csi:
#     driver: secrets-store.csi.k8s.io
#     readOnly: true
#     volumeAttributes:
#       secretProviderClass: my-spc

# ── Ephemeral (inline PVC — provisioned with pod, deleted with pod)
# - name: scratch
#   ephemeral:
#     volumeClaimTemplate:
#       spec:
#         accessModes: [ReadWriteOnce]
#         storageClassName: fast
#         resources:
#           requests:
#             storage: 1Gi

# ── OpenShift-specific: ImageStream as volume via CSI
# (Typically handled via CSI driver, use csi: above)

# ── iSCSI ───────────────────────────────────────────────────────
# - name: iscsi-vol
#   iscsi:
#     targetPortal: 10.0.0.1:3260
#     iqn: iqn.2001.io.k8s:storage.target0
#     lun: 0
#     fsType: ext4

# ── FC (Fibre Channel) ───────────────────────────────────────────
# - name: fc-vol
#   fc:
#     targetWWNs: ["50014ee1"]
#     lun: 0
#     fsType: ext4

# ── GCE Persistent Disk ──────────────────────────────────────────
# - name: gce-disk
#   gcePersistentDisk:
#     pdName: my-disk
#     fsType: ext4

# ── AWS EBS ──────────────────────────────────────────────────────
# - name: ebs-vol
#   awsElasticBlockStore:
#     volumeID: vol-049df61146c4d7901
#     fsType: ext4

# ── Azure Disk ───────────────────────────────────────────────────
# - name: azure-disk
#   azureDisk:
#     diskName: myAKSDisk
#     diskURI: /subscriptions/.../file.vhd

# ── Ceph RBD ─────────────────────────────────────────────────────
# - name: ceph-vol
#   rbd:
#     monitors: [10.16.154.78:6789]
#     image: foo
#     fsType: ext4
#     pool: kube
#     user: admin
#     secretRef:
#       name: ceph-secret

# ── ConfigMap as binary ──────────────────────────────────────────
# (Set binaryData in your ConfigMap spec, mount normally)

