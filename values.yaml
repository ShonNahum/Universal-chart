# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
# kubernetes.io/os: linux
# disk: ssd

tolerations: []
# - key: "dedicated"
#   operator: Equal
#   value: "gpu"
#   effect: NoSchedule
# - key: "node.kubernetes.io/not-ready"
#   operator: Exists
#   effect: NoExecute
#   tolerationSeconds: 300

affinity: {}
# nodeAffinity:
#   requiredDuringSchedulingIgnoredDuringExecution:
#     nodeSelectorTerms:
#       - matchExpressions:
