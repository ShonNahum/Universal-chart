{{/* Roles */}}
{{- range .Values.rbac.roles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
rules:
  {{- toYaml .rules | nindent 2 }}
{{- end }}

{{/* RoleBindings */}}
{{- range .Values.rbac.roleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .roleRef }}
subjects:
  {{- toYaml .subjects | nindent 2 }}
{{- end }}

{{/* ClusterRoles */}}
{{- range .Values.rbac.clusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .name }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
rules:
  {{- toYaml .rules | nindent 2 }}
{{- end }}

{{/* ClusterRoleBindings */}}
{{- range .Values.rbac.clusterRoleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .name }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .roleRef }}
subjects:
  {{- toYaml .subjects | nindent 2 }}
{{- end }}
