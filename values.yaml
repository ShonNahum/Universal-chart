# ---------------------------------------------------------------------------
# Advanced pod settings
# ---------------------------------------------------------------------------
hostNetwork: false
hostIPC: false
hostPID: false
shareProcessNamespace: false
priorityClassName: ""
runtimeClassName: ""
schedulerName: ""
restartPolicy: ""    # leave empty for workloads (Always); set for Jobs

dnsPolicy: ""        # ClusterFirst | ClusterFirstWithHostNet | Default | None
dnsConfig: {}
# nameservers: [8.8.8.8]
# searches: [ns1.svc.cluster.local]
# options:
#   - name: ndots
#     value: "5"

hostAliases: []
# - ip: "127.0.0.1"
#   hostnames: ["foo.local", "bar.local"]

readinessGates: []
# - conditionType: "www.example.com/feature-1"

overhead: {}
# cpu: "250m"
# memory: "128Mi"

# Grace period for pod shutdown before SIGKILL (default: 30s)
terminationGracePeriodSeconds: 30

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP    # ClusterIP | NodePort | LoadBalancer | ExternalName
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      # nodePort: 30080    # for NodePort/LoadBalancer
  annotations: {}
  labels: {}
  # clusterIP: None                    # headless service (required for StatefulSet DNS)
  # externalName: my.db.example.com    # for ExternalName type — selector is omitted automatically
  # loadBalancerIP: ""
  # loadBalancerSourceRanges: []       # restrict LB access by CIDR, e.g. ["10.0.0.0/8"]
  # externalIPs: []                    # list of external IPs routed to this service
  # externalTrafficPolicy: Cluster     # Cluster | Local
  # sessionAffinity: ClientIP          # None | ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800
  # publishNotReadyAddresses: false    # for StatefulSet headless service — include not-ready pods

# ---------------------------------------------------------------------------
# Ingress (standard Kubernetes — use route: for OpenShift)
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: myapp.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  #       portName: http      # optional, defaults to first service port
  tls: []
  # - secretName: myapp-tls
  #   hosts: [myapp.example.com]

# ---------------------------------------------------------------------------
# OpenShift Route
# ---------------------------------------------------------------------------
route:
  enabled: false
  host: ""           # leave empty = auto-assigned by OpenShift
  path: ""
  targetPort: ""     # defaults to first service port name
  annotations: {}
  tls:
    termination: edge                       # edge | passthrough | reencrypt
    insecureEdgeTerminationPolicy: Redirect  # Allow | Redirect | None
    # certificate: |
    #   -----BEGIN CERTIFICATE-----
    # key: |
    #   -----BEGIN RSA PRIVATE KEY-----
    # caCertificate: ""
    # destinationCACertificate: ""  # for reencrypt only

# ---------------------------------------------------------------------------
# ConfigMaps — range: one entry = one ConfigMap
# ---------------------------------------------------------------------------
configMaps: []
# - name: app-config
#   annotations: {}
#   labels: {}
#   data:
#     LOG_LEVEL: info
#     app.conf: |
#       key=value
#   binaryData: {}      # base64-encoded binary data

# ---------------------------------------------------------------------------
# Secrets — range: one entry = one Secret
